<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WaitLess</title><meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="WaitLess">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="app.css"></head><body>
<header><h1 id="appname">WaitLess</h1><button id="locate" aria-label="Recenter">📍</button></header>
<div id="controls"><input id="search" type="search" placeholder="Search restaurants">
<div class="seg" id="filter"><button data-f="all" class="on">All</button><button data-f="fast_food">Fast food</button><button data-f="restaurant">Restaurants</button><button data-f="cafe">Cafés</button></div></div>
<main><div id="map" class="view on"></div>
<div id="list" class="view"><div class="seg" id="sort"><button data-s="wait" class="on">Shortest wait</button><button data-s="dist">Nearest</button></div><ul id="items"></ul></div></main>
<nav><button data-v="map" class="on"><span>🗺️</span>Map</button><button data-v="list"><span>☰</span>List</button></nav>
<div id="sheet" class="hidden"><div class="card" id="sheetbody"></div></div>
<div id="toast" class="hidden"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
