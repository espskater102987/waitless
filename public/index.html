<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WaitLess</title><meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="WaitLess">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="app.css?v=2"></head><body>
<div id="map"></div>
<div id="top"><div class="bar"><svg class="mag" viewBox="0 0 24 24" width="17" height="17"><circle cx="10" cy="10" r="6.5" fill="none" stroke="#8e8e93" stroke-width="2.4"/><path d="m15 15 5 5" stroke="#8e8e93" stroke-width="2.4" stroke-linecap="round"/></svg><input id="search" type="search" placeholder="Search restaurants"></div>
<div class="chips" id="filter"><button data-f="all" class="on">All</button><button data-f="fast_food">Fast food</button><button data-f="restaurant">Restaurants</button><button data-f="cafe">Cafés</button></div></div>
<button id="locate" class="fab" aria-label="Recenter"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="#0a84ff" d="M21 3 3 10.5l7.2 2.3L12.5 20z"/></svg></button>
<section id="list"><div class="grab" id="grab"><i></i></div>
<div class="lhead"><h2 id="appname">Nearby</h2><div class="seg" id="sort"><button data-s="wait" class="on">Shortest wait</button><button data-s="dist">Nearest</button></div></div>
<ul id="items"><li class="msg">Loading places…</li></ul></section>
<div id="sheet" class="hidden"><div class="card" id="sheetbody"></div></div>
<div id="toast" class="hidden"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js?v=2"></script></body></html>
